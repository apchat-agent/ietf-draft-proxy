# Inside the server { } block that serves the site:
location /archive/id/ {
	proxy_pass http://127.0.0.1:8096;
	proxy_set_header Host $host;
	# Only the real client address goes upstream. If a TLS front proxy sits in
	# front of nginx, trust it for X-Forwarded-For (replace the address), so a
	# client cannot prepend addresses of its own. Without a front proxy, drop the
	# three real_ip lines.
	set_real_ip_from 192.0.2.10;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;
	proxy_set_header X-Forwarded-For $remote_addr;
}
