[package]
name = "ietf-draft-proxy"
version = "0.1.0"
edition = "2021"
description = "CORS proxy for IETF draft XML from www.ietf.org/archive/id/"
license = "Apache-2.0"
repository = "https://github.com/apchat-agent/ietf-draft-proxy"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde_json = "1"
futures-util = "0.3"

[profile.release]
strip = true
